name: Publish Plugin API

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-plugin-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish crate and npm packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release tag
        run: node scripts/sync-versions.mjs && node scripts/verify-release-version.mjs

      - name: Ensure generated versions are committed
        run: git diff --exit-code

      - name: Verify publish credentials
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          test -n "$NODE_AUTH_TOKEN"
          npm whoami
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Test Rust crate
        run: cargo test

      - name: Build SDK
        working-directory: sdk
        run: |
          npm install --no-package-lock
          npm run build
          npm pack --dry-run

      - name: Test pack CLI
        working-directory: pack
        run: |
          npm ci
          npm test
          npm pack --dry-run

      - name: Publish Rust crate
        run: |
          cargo publish --dry-run --manifest-path Cargo.toml
          cargo publish --manifest-path Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish SDK to npm
        working-directory: sdk
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish pack CLI to npm
        working-directory: pack
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
